[project]
name = "fuz"
version = "0.1.3"
description = "Fuzzy probability utilities - metapackage"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fuz-core",
    "fuz-lint",
    "fuz-pool",
    "fuz-rank",

]

[project.optional-dependencies]

doc = [
    "numpydoc",
    "pydata-sphinx-theme",
    "soupsieve",
    "sphinx",
    "sphinx-autoapi",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-togglebutton",
    "sphinxcontrib-youtube",
    "sphinx-docsearch",
]

jax = [
    "jax",
    "jaxlib",
]

temp = [
    "expression",
    "seaborn",
]

demo = [
    "fuz-demo",
]

all = [
    "fuz[doc,jax,temp,demo]",
]

[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"
