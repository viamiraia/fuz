[project]
name = "fuz-lint"
version = "0.1.3"
description = "Log-space numerical operations for fuz"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fuz-core",
    "numpy",
    "plum-dispatch",
]

[tool.uv.sources]
fuz-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fuz"]
