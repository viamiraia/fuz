[project]
  name = "fuz-lint"
  version = "0.2.0"
  description = "Log-space numerical integration and operations"
  requires-python = ">=3.10,<3.14"
  dependencies = ["fuz-core", "numpy"]

[build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
  packages = ["fuz"]
