[project]
name = "fuz-demo"
version = "0.1.3"
description = "Interactive demo notebooks for fuz"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fuz-core[marimo]",
    "fuz-lint",
    "fuz-rank",
    "marimo[lsp,mcp,recommended,sql]",
    "pandas",
    "polars",
    "altair",
    "matplotlib",
    "mpltern",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fuz"]
