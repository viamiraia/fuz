[project]
name = "fuz-rank"
version = "0.1.3"
description = "Ranking and plotting utilities for fuz"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fuz-core",
    "numpy",
]

[project.optional-dependencies]
plot = [
    "altair",
    "matplotlib",
    "mpltern",
]

[tool.uv.sources]
fuz-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fuz"]
