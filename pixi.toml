[workspace]
  authors = ['Miraia Chiou <133145224+viamiraia@users.noreply.github.com>']
  channels = ['conda-forge', 'main', 'conda-forge/label/ty_alpha']
  name = 'fuz'
  platforms = ['linux-64', 'osx-64', 'osx-arm64', 'win-64']
  preview = ['pixi-build']

[package]
  name = 'fuz'
  version = '0.1.4-alpha.2'

  [package.build.backend]
    name = 'pixi-build-python'
    version = '*'

  [package.host-dependencies]
    hatchling = '*'
    uv = '*'

[tasks]

[environments]
  default = ['demo', 'plot']
  dev = ['demo', 'dev', 'doc', 'array', 'minpy', 'plot', 'temp']
  devrocm = ['demo', 'dev', 'doc', 'rocm', 'array', 'plot', 'temp']
  doc = ['demo', 'dev', 'doc', 'array', 'maxpy', 'plot']

[dependencies]
  array-api-compat = '*'
  attrs = '*'
  narwhals = '*'
  scipy = '*'

[pypi-dependencies]
  array-api-typing = '*'
  fuz-core = { path = './pkg/fuz-core', editable = true }
  fuz-demo = { path = './pkg/fuz-demo', editable = true }
  fuz-lint = { path = './pkg/fuz-lint', editable = true }
  fuz-pool = { path = './pkg/fuz-pool', editable = true }
  fuz-rank = { path = './pkg/fuz-rank', editable = true }

[feature.plot.dependencies]
  altair = '*'
  matplotlib = '*'
  mpltern = '*'

[feature.demo.dependencies]
  fastparquet = '*'
  linkify-it-py = '*'
  lintegrate = '*'
  mdformat-myst = '*'
  myst-parser = '*'
  pandas = '*'
  polars = '*'
  pyinstrument = '*'
  # marimo
  altair = '*'
  basedpyright = '*'
  duckdb = '*'
  marimo = '*'
  mcp = '*'
  nbformat = '*'
  openai = '*'
  pyarrow = '*'
  pytest = '*'
  python-lsp-ruff = '*'
  python-lsp-server = '*'
  sqlglot = '*'
  ty = { version = "*", channel = "conda-forge/label/ty_alpha" }
  vegafusion = '*'
  vl-convert-python = '*'
  websockets = '*'

[feature.demo.tasks]
  demo = 'marimo run fuz/demo/main.py'
  emo = 'marimo edit -p 3589 --headless --no-token'
  html = { depends-on = ['html-ch1', 'html-ch2'] }
  html-ch1 = 'marimo export html fuz/demo/optimal_bayesian_ranking_ch1.py -o docs/build/html/mo/optimal-bayesian-ranking-ch1-static.html'
  html-ch2 = 'marimo export html fuz/demo/optimal_bayesian_ranking_ch2.py -o docs/build/html/mo/optimal-bayesian-ranking-ch2-static.html'
  wasm = { depends-on = ['wasm-ch1', 'wasm-ch2'] }
  wasm-ch1 = 'marimo export html-wasm fuz/demo/optimal_bayesian_ranking_ch1.py -o docs/build/html/mo/optimal-bayesian-ranking-ch1 --mode run'
  wasm-ch1-test = 'marimo export html-wasm fuz/demo/optimal_bayesian_ranking_ch1.py -o private/mo/optimal-bayesian-ranking-ch1 --mode edit'
  wasm-ch2 = 'marimo export html-wasm fuz/demo/optimal_bayesian_ranking_ch2.py -o docs/build/html/mo/optimal-bayesian-ranking-ch2 --mode run'
  wasm-ch2-test = 'marimo export html-wasm fuz/demo/optimal_bayesian_ranking_ch2.py -o private/mo/optimal-bayesian-ranking-ch2 --mode edit'
  wasm-test = { depends-on = ['wasm-ch1-test', 'wasm-ch2-test'] }

[feature.dev.dependencies]
  hypothesis = '*'
  ipykernel = '*'
  ipympl = '*'
  ipywidgets = '*'
  jaxtyping = '*'
  mypy = '*'
  nox = '*'
  plum-dispatch = '*'
  pytest = '*'
  pytest-benchmark = '*'
  pytest-cov = '*'
  ruff = '*'
  scipy-stubs = '*'
  tqdm = '*'
  wat-inspector = '*'
  # marimo extras
  duckdb = '*'
  # nbformat = '*' # repeat
  basedpyright = '*'
  openai = '*'
  python-lsp-ruff = '*'
  python-lsp-server = '*'
  sqlglot = '*'
  ty = '*'                # { version = "*", channel = "conda-forge/label/ty_alpha" }
  vegafusion = '*'
  vl-convert-python = '*'
  websockets = '*'

[feature.dev.tasks]
  format = 'ruff format pkg'
  lint = 'ruff check pkg'
  mypy = 'mypy fuz'
  test = 'pytest -v tests'
  test-lint = 'pytest -v pkg/fuz-lint/tests'

[feature.doc.dependencies]
  numpydoc = '*'
  pydata-sphinx-theme = '*'
  soupsieve = '*'
  sphinx = '*'
  sphinx-autoapi = '*'
  sphinx-autodoc-typehints = '*'
  sphinx-copybutton = '*'
  sphinx-design = '*'
  sphinx-togglebutton = '*'
  sphinxcontrib-youtube = '*'

[feature.doc.pypi-dependencies]
  sphinx-docsearch = '*'

[feature.doc.tasks]
  doc = { depends-on = ['html', 'sphinx', 'wasm'] }
  sphinx = { cmd = 'make html', cwd = 'docs' }
  testdoc = { cmd = 'python -m http.server', cwd = 'docs/build/html' }

[feature.minpy.dependencies]
  python = '3.10.*'

[feature.maxpy.dependencies]
  python = '>=3.10'

[feature.temp.dependencies]
  expression = '*'
  seaborn = '*'

[feature.cuda]
  system-requirements = { cuda = '12' }

  [feature.cuda.target.linux-64.dependencies]
    # jaxlib-feedstock fixed conda cuda issue in 0.4.35
    jaxlib = { version = '>=0.4.35', build = '*cuda12*', channel = 'conda-forge' }
    pytorch-gpu = '*'

[feature.array.dependencies]
  jax = '*'
  numpy = '*'

[feature.rocm]
  [feature.rocm.dependencies]
    python = "3.12.*"
    nomkl = "*"

  [feature.rocm.target.win-64.pypi-dependencies]
    rocm-sdk-core = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2/rocm_sdk_core-7.2.0.dev0-py3-none-win_amd64.whl" }
    rocm-sdk-devel = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2/rocm_sdk_devel-7.2.0.dev0-py3-none-win_amd64.whl" }
    rocm-sdk-libraries-custom = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2/rocm_sdk_libraries_custom-7.2.0.dev0-py3-none-win_amd64.whl" }
    rocm = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2/rocm-7.2.0.dev0.tar.gz" }
    torch = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2/torch-2.9.1%2Brocmsdk20260116-cp312-cp312-win_amd64.whl" }
    torchaudio = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2/torchaudio-2.9.1%2Brocmsdk20260116-cp312-cp312-win_amd64.whl" }
    torchvision = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2/torchvision-0.24.1%2Brocmsdk20260116-cp312-cp312-win_amd64.whl" }
